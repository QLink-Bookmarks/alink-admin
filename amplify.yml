version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
        - export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH"
        - node --version && bun --version
        - bun install --frozen-lockfile
    build:
      commands:
        - nvm use 22
        - export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH"
        - node --version && bun --version
        - bun run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
